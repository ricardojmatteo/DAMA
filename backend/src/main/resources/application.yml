spring:
  application:
    name: dama-intelligence-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dama}
    username: ${DB_USER:dama}
    password: ${DB_PASSWORD:dama}
  jdbc:
    template:
      query-timeout: 5

server:
  port: 8080

# Alertas de gestão (RF15): com ALERTAS_URL o backend usa o alert-service Node.js (ADR-0009);
# vazia, usa só as regras locais em Java. Se o serviço falhar, o backend também cai nas regras locais.
dama:
  alertas:
    url: ${ALERTAS_URL:}
    timeout-ms: ${ALERTAS_TIMEOUT_MS:2000}
  # Ranking (docs/requisitos/ranking.md): janela padrão, limite de tokens por story point, franquia grátis e teto do bônus do gestor
  ranking:
    tokens-por-ponto: ${RANKING_TOKENS_POR_PONTO:20000}
    franquia-gratis: ${RANKING_FRANQUIA_GRATIS:0.25}
    bonus-maximo: ${RANKING_BONUS_MAXIMO:0.15}
    janela-padrao-dias: ${RANKING_JANELA_DIAS:30}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    br.com.dama.intelligence: INFO
