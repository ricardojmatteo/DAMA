  <text x="625" y="355" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="168" letter-spacing="50" fill="url(#texto)">DAMA</text>
  <line x1="300" y1="433" x2="372" y2="433" stroke="#FF8A2A" stroke-width="1.5"/>
  <text x="600" y="440" text-anchor="middle" font-family="Hind, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="22" letter-spacing="5.5" fill="#F6DCC4">ELEGÂNCIA EM MOVIMENTO</text>
  <line x1="828" y1="433" x2="900" y2="433" stroke="#FF8A2A" stroke-width="1.5"/>
