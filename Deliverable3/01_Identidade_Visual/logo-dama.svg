    <linearGradient id="texto" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#FFE3C2"/>
      <stop offset="0.3" stop-color="#FFB061"/>
      <stop offset="0.62" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#E0570B"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="blur-fino" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1200" height="675" fill="#0B0907"/>
  <g filter="url(#blur)">
