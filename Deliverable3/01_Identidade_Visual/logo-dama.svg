    <ellipse cx="960" cy="230" rx="450" ry="120" fill="#C24E10" opacity="0.5" transform="rotate(-24 960 230)"/>
    <ellipse cx="620" cy="620" rx="500" ry="130" fill="#F2B27A" opacity="0.22" transform="rotate(-10 620 620)"/>
  </g>
  <g filter="url(#blur-fino)">
